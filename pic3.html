<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1A1A2E; }
  figure { width: 100%; border-top: 4px solid; border-image: linear-gradient(90deg, #1A1A2E, #00C853) 1; }
  figure img { display: block; width: 100%; height: 360px; object-fit: cover; }
  figcaption { background: #12122a; color: #9a9aaa; font-family: system-ui, sans-serif; font-size: 13px; padding: 12px 18px; line-height: 1.5; }
</style>
</head>
<body>
<figure>
  <img src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=1200&q=80" alt="Football on a grass pitch inside a large stadium at dusk with floodlights on" loading="lazy">
  <figcaption>Estadio Azteca in Mexico City generates more landfill waste per match than any other venue — in a city already managing one of the worst water crises of any major urban area on earth. Photo: Unsplash</figcaption>
</figure>
</body>
</html>
