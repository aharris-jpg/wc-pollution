<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1A1A2E; }
  figure { width: 100%; border-top: 4px solid; border-image: linear-gradient(90deg, #1A1A2E, #00C853) 1; }
  figure img { display: block; width: 100%; height: 360px; object-fit: cover; }
  figcaption { background: #12122a; color: #9a9aaa; font-family: system-ui, sans-serif; font-size: 13px; padding: 12px 18px; line-height: 1.5; }
</style>
</head>
<body>
<figure>
  <img src="https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=1200&q=80" alt="Football fans cheering in a packed stadium on a sunny matchday" loading="lazy">
  <figcaption>Arrowhead Stadium in Kansas City sits on the most carbon-intensive electricity grid of any 2026 host — generating 79 times more electricity-related carbon per match than BC Place in Vancouver. Photo: Unsplash</figcaption>
</figure>
</body>
</html>
